name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: pytest -q -n auto tests
      - name: the lighthouse still builds (make example)
        run: python skills/snapwright/scripts/sw.py build examples/lighthouse/design.py --out examples/lighthouse/out --seeds 6 --no-book
