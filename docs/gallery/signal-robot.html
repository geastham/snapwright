<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Robot</title>
<style>
  :root { --bg:#f1efe9; --ink:#1d2327; --soft:#6b7479; --card:rgba(255,255,255,.86); --line:rgba(0,0,0,.08); --acc:#ff4628; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#101315; --ink:#eef1f2; --soft:#98a2a7; --card:rgba(26,31,34,.86); --line:rgba(255,255,255,.08); } }
  :root[data-theme="dark"] { --bg:#101315; --ink:#eef1f2; --soft:#98a2a7; --card:rgba(26,31,34,.86); --line:rgba(255,255,255,.08); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  :root { padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; }
  .ui { position:fixed; z-index:2; }
  header { top:calc(18px + env(safe-area-inset-top,0px)); left:20px; }
  header h1 { margin:0; font-size:clamp(24px,4vw,40px); letter-spacing:-.02em; }
  header p { margin:2px 0 0; color:var(--soft); }
  nav { top:calc(18px + env(safe-area-inset-top,0px)); right:20px; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; max-width:55vw; }
  button { font:inherit; font-weight:600; font-size:13px; color:var(--ink); background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:7px 12px; cursor:pointer; }
  button.on { background:var(--ink); color:var(--bg); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; backdrop-filter:blur(10px); }
  #checks, #bom { display:none; padding:14px 16px; max-height:60vh; overflow:auto; width:min(340px,86vw); }
  #checks { left:20px; bottom:calc(92px + env(safe-area-inset-bottom,0px)); }
  #bom { right:20px; top:74px; }
  #checks.open, #bom.open { display:block; }
  h2 { margin:0 0 8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); }
  ul { margin:0; padding-left:18px; } li { margin:3px 0; }
  li.change { color:var(--acc); } li.fail { color:var(--acc); font-weight:700; } li.note { color:var(--soft); }
  .row { display:grid; grid-template-columns:14px 1fr auto; gap:8px; align-items:center; font-size:12.5px; padding:2px 0; }
  .sw { width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.2); }
  footer { left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; align-items:center;
    padding:10px 14px; width:min(720px,94vw); }
  footer input { flex:1; accent-color:var(--acc); }
  .note { font-size:11.5px; color:var(--soft); margin-top:10px; }
</style>
</head>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const M = JSON.parse(document.getElementById('model').textContent);
const $ = id => document.getElementById(id);
const S = 8, P = 3.2;             // mm per stud, per plate
const parts = M.parts, NSTEP = M.steps.length;
$('title').textContent = M.meta.title;
$('sub').textContent = `${M.stats.parts.toLocaleString()} parts · ${M.stats.height_cm} cm · ${M.stats.numbered_steps || NSTEP} steps`
  + ((M.stats.bags || 1) > 1 ? ` · ${M.stats.bags} bags` : '');
const LBL = M.steps.map(s => s.label || String(s.n));
$('tot').textContent = LBL.length ? LBL[LBL.length - 1].split('.')[0] : 0;
const BAGS = Math.max(1, ...M.steps.map(s => s.bag || 1));
$('disc').textContent = M.meta.disclaimer || '';

// ---------- scene ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);   // transparent: the themed page background shows through
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(35, 1, 1, 5000);
const ctl = new OrbitControls(cam, canvas); ctl.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(300, 600, 400); scene.add(sun);
const [NX, NZ, NY] = M.grid.shape;
const cx = NX * S / 2, cz = NZ * S / 2, H = NY * P;
cam.position.set(cx + H * 1.4 + 120, H * 0.9 + 60, cz + H * 1.4 + 120);
ctl.target.set(cx, H * 0.42, cz);
const ground = new THREE.Mesh(new THREE.CircleGeometry(Math.max(NX, NZ) * S, 64),
  new THREE.MeshStandardMaterial({ color: 0x888888, transparent: true, opacity: .12 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(cx, -0.05, cz); scene.add(ground);

// ---------- instanced parts ----------
const order = parts.map((p, i) => i).sort((a, b) => parts[a].step - parts[b].step || parts[a].y - parts[b].y);
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const mat = new THREE.MeshStandardMaterial({ roughness: .45, metalness: 0 });
// shaped parts: one instanced mesh per geometry (slope profile or cylinder)
function slopeGeo(L, h, lip, inverted) {  // width 1 (x), length L*S along local +z (low side), height h*P
  const l = L * S, hh = h * P, lp = lip * P, back = L > 1 ? S : 0, sh = new THREE.Shape();
  // drawn in (X = z, Y = y) and extruded along Z; rotateY(-pi/2) turns X onto local z and the
  // extrusion onto -x (a rotation, not a mirror, so faces keep their winding)
  const pts = inverted
    ? [[-l / 2, 0], [-l / 2 + back, 0], [l / 2, hh - lp], [l / 2, hh], [-l / 2, hh]]
    : [[-l / 2, 0], [l / 2, 0], [l / 2, lp], [-l / 2 + back, hh], [-l / 2, hh]];
  sh.moveTo(pts[0][0], pts[0][1]); for (const [a, b] of pts.slice(1)) sh.lineTo(a, b);
  const g = new THREE.ExtrudeGeometry(sh, { depth: 1, bevelEnabled: false });
  g.rotateY(-Math.PI / 2); g.translate(0.5, 0, 0); return g;
}
const groups = new Map();              // key -> {geo, idx: [part indices]}
const keyOf = p => p.shape === 'round' ? `r${p.dx}:${p.h}` : p.shape ? `${p.shape}:${p.L}:${p.h}:${p.lip}` : 'box';
for (const i of order) { const p = parts[i], k = keyOf(p);
  if (!groups.has(k)) groups.set(k, { p, idx: [] }); groups.get(k).idx.push(i); }
for (const [k, g] of groups) {
  const p = g.p;
  g.geo = k === 'box' ? boxGeo : p.shape === 'round'
    ? new THREE.CylinderGeometry(p.dx / 2 * S * .98, p.dx / 2 * S * .98, p.h * P - 0.12, 24).translate(0, p.h * P / 2, 0)
    : slopeGeo(p.L, p.h, p.lip, p.shape === 'slope_inv');
  g.mesh = new THREE.InstancedMesh(g.geo, mat, g.idx.length);
  g.idx.forEach((i, n) => g.mesh.setColorAt(n, new THREE.Color(M.colors[parts[i].color].hex)));
  scene.add(g.mesh);
}
// sideways panels: built flat, then slid onto the side studs at their attach step
const panelParts = [];
for (const pn of (M.panels || [])) for (const b of pn.parts) panelParts.push({ pn, b });
const panelMesh = new THREE.InstancedMesh(boxGeo, mat, Math.max(1, panelParts.length));
panelParts.forEach(({ b }, k) => panelMesh.setColorAt(k, new THREE.Color(M.colors[b.color].hex)));
panelMesh.count = 0; scene.add(panelMesh);
// new-part highlight: tint the parts of the current step towards the accent colour
const ACC = new THREE.Color('#ff4628');
const slot = [];                       // part index -> [mesh, instance]
for (const [k, g] of groups) g.idx.forEach((i, n) => { slot[i] = [g.mesh, n]; });
const baseCol = i => new THREE.Color(M.colors[parts[i].color].hex);
const panelSlots = panelParts.map((pp, k) => [panelMesh, k, new THREE.Color(M.colors[pp.b.color].hex), pp.pn.step]);
let hlStep = -1;
function highlight(s) {
  if (s === hlStep) return;
  const paint = (step, on) => {
    for (const i of (byStep[step] || [])) { const [mesh, n] = slot[i]; const c = baseCol(i);
      mesh.setColorAt(n, on ? c.lerp(ACC, 0.45) : c); mesh.instanceColor.needsUpdate = true; }
    for (const [mesh, n, c, st] of panelSlots) if (st === step) {
      mesh.setColorAt(n, on ? c.clone().lerp(ACC, 0.45) : c); mesh.instanceColor.needsUpdate = true; }
  };
  paint(hlStep, false); paint(s, true); hlStep = s;
}
const byStep = {};
parts.forEach((p, i) => (byStep[p.step] ||= []).push(i));
const studGeo = new THREE.CylinderGeometry(2.4, 2.4, 1.8, 16);
const studList = [];
for (const i of order) { const p = parts[i];
  if (p.tc) { for (const [a, b] of p.tc) studList.push([i, a - p.x, b - p.z]); continue; }
  if (!p.studs) continue;
  for (let a = 0; a < p.dx; a++) for (let b = 0; b < p.dz; b++) studList.push([i, a, b]); }
const studs = new THREE.InstancedMesh(studGeo, mat, studList.length);
const col = new THREE.Color(), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), sc = new THREE.Vector3();
const hex = p => M.colors[p.color].hex;
const up = new THREE.Vector3(0, 1, 0), ROT = [Math.PI / 2, 0, -Math.PI / 2, Math.PI];  // local +z -> +x, +z, -x, -z
studList.forEach(([i], k) => studs.setColorAt(k, col.set(hex(parts[i]))));
scene.add(studs);
const gap = 0.12;
function place(t) {                 // t = build time in steps (fractional)
  for (const [k, g] of groups) {
    let n = 0;
    for (const i of g.idx) { const p = parts[i];
      const local = t - (p.step - 1); if (local <= 0) break;
      const drop = Math.max(0, 1 - local * 1.6) ** 2 * 60;
      if (k === 'box') {
        v.set((p.x + p.dx / 2) * S, (p.y + p.h / 2) * P + drop, (p.z + p.dz / 2) * S);
        sc.set(p.dx * S - gap, p.h * P - gap, p.dz * S - gap); q.identity();
      } else {
        v.set((p.x + p.dx / 2) * S, p.y * P + drop, (p.z + p.dz / 2) * S);
        const width = p.shape === 'round' ? 1 : (p.dir % 2 ? p.dx : p.dz);
        sc.set(p.shape === 'round' ? 1 : width * S - gap, 1, 1);
        q.setFromAxisAngle(up, p.shape === 'round' ? 0 : ROT[p.dir]);
      }
      g.mesh.setMatrixAt(n++, m4.compose(v, q, sc));
    }
    g.mesh.count = n; g.mesh.instanceMatrix.needsUpdate = true;
  }
  let np = 0;
  q.identity();
  for (const { pn, b } of panelParts) {
    const local = t - (pn.step - 1); if (local <= 0) continue;
    const slide = Math.max(0, 1 - local * 1.2) ** 2 * 80 + (exploded ? 60 : 0);   // along the face normal
    v.set((b.lo[0] + b.hi[0]) / 2 + pn.n[0] * slide, (b.lo[1] + b.hi[1]) / 2, (b.lo[2] + b.hi[2]) / 2 + pn.n[2] * slide);
    sc.set(b.hi[0] - b.lo[0] - gap, b.hi[1] - b.lo[1] - gap, b.hi[2] - b.lo[2] - gap);
    panelMesh.setMatrixAt(np++, m4.compose(v, q, sc));
  }
  panelMesh.count = np; panelMesh.instanceMatrix.needsUpdate = true;
  let ns = 0;
  q.identity();
  for (const [i, a, b] of studList) { const p = parts[i];
    const local = t - (p.step - 1); if (local <= 0) continue;
    const drop = Math.max(0, 1 - local * 1.6) ** 2 * 60;
    v.set((p.x + a + .5) * S, (p.y + p.h) * P + .9 + drop, (p.z + b + .5) * S);
    studs.setMatrixAt(ns++, m4.compose(v, q, sc.set(1, 1, 1)));
  }
  studs.count = ns;
  studs.instanceMatrix.needsUpdate = true;
}

// ---------- playback ----------
let T = 0, playing = true, exploded = false;
{ // ?step=N opens the viewer paused at that step (handy for links and screenshots)
  const q = new URLSearchParams(location.search).get('step');
  if (q !== null) {
    T = Math.max(0, Math.min(NSTEP, +q || 0)) + 0.999; playing = false;
    $('bPlay').textContent = 'Play'; $('scrub').value = Math.round(T / (NSTEP + 1) * 1000);
  }
}
const rate = Math.max(1.2, NSTEP / 40);  // whole build in ~40 s
$('bPlay').onclick = () => { playing = !playing; $('bPlay').textContent = playing ? 'Pause' : 'Play'; if (playing && T >= NSTEP + 1) T = 0; };
$('scrub').oninput = e => { T = (+e.target.value / 1000) * (NSTEP + 1); playing = false; $('bPlay').textContent = 'Play'; };
// step-by-step: jump to the end of a step (all its parts in place, highlighted)
function goStep(k) {
  k = Math.max(0, Math.min(NSTEP, k));
  T = k + 0.999; playing = false; $('bPlay').textContent = 'Play';
  $('scrub').value = Math.round(T / (NSTEP + 1) * 1000);
}
$('bPrev').onclick = () => goStep(Math.floor(T) - (T % 1 > 0.99 ? 1 : 0));
$('bNext').onclick = () => goStep(Math.floor(T) + 1);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  if (e.key === 'ArrowRight') { $('bNext').click(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { $('bPrev').click(); e.preventDefault(); }
  else if (e.key === ' ') { $('bPlay').click(); e.preventDefault(); }
});
if ((M.panels || []).length) {
  $('bExplode').hidden = false;
  if (new URLSearchParams(location.search).has('explode')) { exploded = true; $('bExplode').classList.add('on'); }
  $('bExplode').onclick = () => { exploded = !exploded; $('bExplode').classList.toggle('on', exploded); };
}
// record the build (whole playback) as a WebM video
$('bRec').onclick = () => {
  if (!window.MediaRecorder || !canvas.captureStream) { $('bRec').textContent = 'Not supported'; return; }
  const rec = new MediaRecorder(canvas.captureStream(30), { mimeType: 'video/webm' });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => { dl(`${M.meta.slug}-build.webm`, new Blob(chunks, { type: 'video/webm' }), 'video/webm');
                       $('bRec').textContent = 'Record'; $('bRec').classList.remove('on'); };
  T = 0; playing = true; $('bPlay').textContent = 'Pause'; $('bRec').textContent = 'Recording...';
  $('bRec').classList.add('on'); rec.start();
  const wait = setInterval(() => { if (!playing) { clearInterval(wait); setTimeout(() => rec.stop(), 800); } }, 200);
};
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;  // first frame can predate `last`
  if (playing) { T = Math.min(NSTEP + 1, T + dt * rate); if (T >= NSTEP + 1) { playing = false; $('bPlay').textContent = 'Replay'; } }
  place(T);
  const cur = Math.min(NSTEP, Math.floor(T));
  highlight(playing ? cur + 1 : cur);
  $('now').textContent = cur ? LBL[cur - 1] : 0;
  $('bag').textContent = cur && BAGS > 1 ? `(bag ${M.steps[cur - 1].bag} of ${BAGS})` : '';
  if (playing) $('scrub').value = Math.round(T / (NSTEP + 1) * 1000);
  ctl.update(); renderer.render(scene, cam);
});

// ---------- panels ----------
const st = M.stats;
$('checkList').innerHTML = M.report.map(r =>
  `<li class="${r.kind}">${r.text.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</li>`).join('');
const byColor = {};
for (const [pid, c, qn] of M.bom) (byColor[c] ||= []).push([pid, qn]);
$('bomList').innerHTML = Object.entries(byColor).map(([c, rows]) =>
  `<div style="margin:8px 0 2px;font-weight:700;display:flex;gap:6px;align-items:center"><span class="sw" role="img" aria-label="${M.colors[c].name}" style="background:${M.colors[c].hex}"></span>${M.colors[c].name}</div>` +
  rows.map(([pid, qn]) => `<div class="row"><span></span><span>${M.catalog_names[pid]} <span style="color:var(--soft)">#${pid}</span></span><b>${qn}</b></div>`).join('')).join('');
const dl = (name, data, type) => { const a = document.createElement('a');
  a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type })); a.download = name; a.click(); };
$('dlXml').onclick = () => dl(`${M.meta.slug}-bricklink.xml`, '<INVENTORY>\n' + M.bom.map(([pid, c, qn]) =>
  `  <ITEM><ITEMTYPE>P</ITEMTYPE><ITEMID>${pid}</ITEMID><COLOR>${M.colors[c].bricklink}</COLOR><MINQTY>${qn}</MINQTY></ITEM>`).join('\n') + '\n</INVENTORY>\n', 'application/xml');
$('dlCsv').onclick = () => dl(`${M.meta.slug}-parts.csv`, 'Part ID,Part,Colour,Qty\n' + M.bom.map(([pid, c, qn]) =>
  `${pid},"${M.catalog_names[pid]}",${M.colors[c].name},${qn}`).join('\n') + '\n', 'text/csv');
const tog = (b, el) => { $(el).classList.toggle('open'); $(b).classList.toggle('on'); };
$('bChecks').onclick = () => tog('bChecks', 'checks');
$('bParts').onclick = () => tog('bParts', 'bom');
$('bTheme').onclick = () => { const r = document.documentElement; const dark = getComputedStyle(r).getPropertyValue('--bg').trim() === '#101315';
  r.dataset.theme = dark ? 'light' : 'dark'; };
if (innerWidth > 1100) tog('bChecks', 'checks');
</script>
